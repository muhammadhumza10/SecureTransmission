<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Transmission — Dashboard</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --danger: #f85149;
    --border: #30363d;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #57606a;
      --accent: #1a7f37;
      --danger: #cf222e;
      --border: #d0d7de;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    flex: 1;
    min-width: 220px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--accent);
    color: #04260f;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
  }
  #status {
    display: inline-block;
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  #status.live { color: var(--accent); }
  #status.down { color: var(--danger); }
  .stream-wrap {
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
  }
  #streamImg {
    width: 100%;
    display: block;
  }
  .placeholder {
    color: var(--muted);
    padding: 60px 20px;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Secure Transmission — Dashboard</h1>
  <p class="sub">Submarine camera relay viewer</p>

  <div class="panel">
    <div class="row">
      <input type="text" id="ipInput" placeholder="Phone IP (e.g. 100.x.x.x for Tailscale, or local WiFi IP)" />
      <input type="text" id="portInput" placeholder="Port" value="8080" style="max-width:90px;" />
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn" class="secondary">Disconnect</button>
    </div>
    <span id="status">Not connected</span>
  </div>

  <div class="panel">
    <div class="stream-wrap">
      <img id="streamImg" style="display:none;" alt="Live stream" />
      <div id="placeholder" class="placeholder">
        Enter the phone's IP above and click Connect.<br>
        If the phone is on mobile data and this laptop is on WiFi, install Tailscale on
        both devices first and use the Tailscale IP (starts with 100.) — see README.md.
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <button id="snapshotBtn" class="secondary">Save Snapshot</button>
      <button id="fullscreenBtn" class="secondary">Fullscreen</button>
    </div>
  </div>
</div>

<script>
  const ipInput = document.getElementById('ipInput');
  const portInput = document.getElementById('portInput');
  const connectBtn = document.getElementById('connectBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');
  const streamImg = document.getElementById('streamImg');
  const placeholder = document.getElementById('placeholder');
  const statusEl = document.getElementById('status');
  const snapshotBtn = document.getElementById('snapshotBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  // Remember last-used IP/port locally (this browser only).
  try {
    ipInput.value = localStorage.getItem('st_ip') || '';
    portInput.value = localStorage.getItem('st_port') || '8080';
  } catch (e) {}

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  connectBtn.addEventListener('click', () => {
    const ip = ipInput.value.trim();
    const port = portInput.value.trim() || '8080';
    if (!ip) {
      setStatus('Enter the phone\'s IP first', 'down');
      return;
    }
    try {
      localStorage.setItem('st_ip', ip);
      localStorage.setItem('st_port', port);
    } catch (e) {}

    const url = `http://${ip}:${port}/stream?_=${Date.now()}`;
    streamImg.onerror = () => {
      setStatus('Could not reach stream — check IP, port, and that the app is running', 'down');
      streamImg.style.display = 'none';
      placeholder.style.display = 'block';
    };
    streamImg.onload = () => {
      setStatus('Live', 'live');
    };
    streamImg.src = url;
    streamImg.style.display = 'block';
    placeholder.style.display = 'none';
    setStatus('Connecting…');
  });

  disconnectBtn.addEventListener('click', () => {
    streamImg.src = '';
    streamImg.style.display = 'none';
    placeholder.style.display = 'block';
    setStatus('Not connected');
  });

  snapshotBtn.addEventListener('click', () => {
    if (!streamImg.src) return;
    const canvas = document.createElement('canvas');
    canvas.width = streamImg.naturalWidth || 640;
    canvas.height = streamImg.naturalHeight || 480;
    const ctx = canvas.getContext('2d');
    try {
      ctx.drawImage(streamImg, 0, 0, canvas.width, canvas.height);
      const link = document.createElement('a');
      link.download = `snapshot-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      alert('Could not save snapshot (browser blocked cross-origin canvas read). Right-click the image and "Save image as" instead.');
    }
  });

  fullscreenBtn.addEventListener('click', () => {
    if (streamImg.requestFullscreen) streamImg.requestFullscreen();
  });
</script>
</body>
</html>
