plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.humza.securetransmission'
    compileSdk 34

    defaultConfig {
        applicationId "com.humza.securetransmission"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Baked into the APK so nothing has to be typed on the phone.
        // Sources (first found wins): env var, gradle property, relay.properties file.
        def relayProps = new Properties()
        def relayFile = rootProject.file('relay.properties')
        if (relayFile.exists()) relayFile.withInputStream { relayProps.load(it) }
        def cfg = { String name ->
            (System.getenv(name) ?: project.findProperty(name) ?: relayProps.getProperty(name) ?: "").toString().trim()
        }
        buildConfigField "String", "RELAY_URL", "\"${cfg('RELAY_URL')}\""
        buildConfigField "String", "STREAM_KEY", "\"${cfg('STREAM_KEY')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"

    // Lightweight embedded HTTP server for MJPEG streaming (pure Java, CI-friendly)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // WebSocket client used to push frames to the online relay
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
